services:
  mariadb:
    image: mariadb:11
    container_name: ropa_mariadb
    restart: always
    command: --max_allowed_packet=256M
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: ropa_db
    ports:
      - "3306:3306"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -proot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ropa-app
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/ropa_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ropa_db
      DB_ADMIN_USER: root
      DB_ADMIN_PASSWORD: root
      DB_WAIT_MAX_ATTEMPTS: 90
      DB_WAIT_INTERVAL_SECONDS: 2

      SERVER_SERVLET_SESSION_TIMEOUT: 30d
      SERVER_SERVLET_SESSION_COOKIE_NAME: MODA_SESSION
      SERVER_SERVLET_SESSION_COOKIE_MAX_AGE: 30d
      SERVER_SERVLET_SESSION_COOKIE_HTTP_ONLY: "true"
      SERVER_SERVLET_SESSION_COOKIE_SAME_SITE: lax
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"

      APP_FRONTEND_URL: http://209.97.178.50:8081

      APP_MAIL_RELAY_SENDER_ENABLED: "true"
