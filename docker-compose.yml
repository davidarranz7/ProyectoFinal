services:
  mariadb:
    image: mariadb:11
    container_name: ropa_mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: ropa_db
    ports:
      - "3306:3306"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -proot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ropa-app
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/ropa_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      SERVER_SERVLET_SESSION_TIMEOUT: ${SERVER_SERVLET_SESSION_TIMEOUT:-30d}
      SERVER_SERVLET_SESSION_COOKIE_NAME: ${SERVER_SERVLET_SESSION_COOKIE_NAME:-MODA_SESSION}
      SERVER_SERVLET_SESSION_COOKIE_MAX_AGE: ${SERVER_SERVLET_SESSION_COOKIE_MAX_AGE:-30d}
      SERVER_SERVLET_SESSION_COOKIE_HTTP_ONLY: ${SERVER_SERVLET_SESSION_COOKIE_HTTP_ONLY:-true}
      SERVER_SERVLET_SESSION_COOKIE_SAME_SITE: ${SERVER_SERVLET_SESSION_COOKIE_SAME_SITE:-lax}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:-false}

      APP_MAIL_RELAY_SENDER_ENABLED: ${APP_MAIL_RELAY_SENDER_ENABLED:-false}
      APP_MAIL_RELAY_RECEIVER_URL: ${APP_MAIL_RELAY_RECEIVER_URL:-http://5.224.57.186:8787/internal/mail-relay/send}
      APP_MAIL_RELAY_TOKEN: ${APP_MAIL_RELAY_TOKEN:-y9qB7dnvLEWTCzMjl1mD6Kt8i2hAXGfUQ4ogebNu5JYxHZrR}
      APP_MAIL_RELAY_ALLOWED_SERVER_IP: ${APP_MAIL_RELAY_ALLOWED_SERVER_IP:-209.97.178.50}
      APP_MAIL_RELAY_CONNECT_TIMEOUT_MS: ${APP_MAIL_RELAY_CONNECT_TIMEOUT_MS:-2500}
      APP_MAIL_RELAY_READ_TIMEOUT_MS: ${APP_MAIL_RELAY_READ_TIMEOUT_MS:-8000}
      APP_MAIL_RELAY_RETRY_INTERVAL_MS: ${APP_MAIL_RELAY_RETRY_INTERVAL_MS:-60000}

      APP_SCRAPING_RELAY_ENABLED: ${APP_SCRAPING_RELAY_ENABLED:-true}
      APP_SCRAPING_RELAY_RECEIVER_URL: ${APP_SCRAPING_RELAY_RECEIVER_URL:-http://5.224.57.186:8787/internal/mail-relay/scraping}
      APP_SCRAPING_RELAY_TOKEN: ${APP_SCRAPING_RELAY_TOKEN:-y9qB7dnvLEWTCzMjl1mD6Kt8i2hAXGfUQ4ogebNu5JYxHZrR}
      APP_SCRAPING_RELAY_CONNECT_TIMEOUT_MS: ${APP_SCRAPING_RELAY_CONNECT_TIMEOUT_MS:-2500}
      APP_SCRAPING_RELAY_READ_TIMEOUT_MS: ${APP_SCRAPING_RELAY_READ_TIMEOUT_MS:-300000}
      APP_SCRAPING_RELAY_RETRY_INTERVAL_MS: ${APP_SCRAPING_RELAY_RETRY_INTERVAL_MS:-60000}

      APP_SCRAPING_AUTO_ENABLED: ${APP_SCRAPING_AUTO_ENABLED:-false}
      APP_SCRAPING_AUTO_INITIAL_DELAY_MS: ${APP_SCRAPING_AUTO_INITIAL_DELAY_MS:-300000}
      APP_SCRAPING_AUTO_FIXED_DELAY_MS: ${APP_SCRAPING_AUTO_FIXED_DELAY_MS:-21600000}

      APP_SCRAPING_ADMIN_SUMMARY_ENABLED: ${APP_SCRAPING_ADMIN_SUMMARY_ENABLED:-true}
      APP_SCRAPING_ADMIN_SUMMARY_FALLBACK_EMAIL: ${APP_SCRAPING_ADMIN_SUMMARY_FALLBACK_EMAIL:-tiendamodadavid@gmail.com}

      APP_USER_NOTIFICATIONS_PRICE_DROP_ENABLED: ${APP_USER_NOTIFICATIONS_PRICE_DROP_ENABLED:-true}
      APP_USER_NOTIFICATIONS_EMAIL_ENABLED: ${APP_USER_NOTIFICATIONS_EMAIL_ENABLED:-false}

  frontend:
    build: ./frontend
    container_name: ropa-frontend
    restart: always
    ports:
      - "8081:80"

volumes:
  mariadb_data: