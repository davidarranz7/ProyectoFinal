  db-backup:
    image: mariadb:11
    container_name: ropa_db_backup
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ropa_db
      DB_ADMIN_USER: root
      DB_ADMIN_PASSWORD: root
      BACKUP_INTERVAL_SECONDS: 86400
      BACKUP_RETENTION_DAYS: 14
    volumes:
      - ./backups:/backups
      - ./docker/db-backup.sh:/usr/local/bin/db-backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/db-backup.sh"]

  frontend:
    build: ./frontend
    container_name: ropa-frontend
    restart: always
    ports:
