<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="login-page">
        <section class="login-wrapper">
            <div class="login-visual"></div>

            <div class="login-box">
                <a href="#" class="back-btn" onclick="window.parent.cerrarAuthOverlay(); return false;">←</a>

                <div class="brand">
                    <div class="brand-logo">M</div>
                    <div class="brand-text">
                        <strong>MODA</strong>
                    </div>
                </div>

                <div class="login-header">
                    <h1>Iniciar sesión</h1>
                </div>

                <form id="login-form" class="login-form">
                    <div class="field">
                        <input type="text" id="usuario" placeholder=" " required>
                        <label for="usuario">Usuario</label>
                    </div>

                    <div class="field">
                        <input type="password" id="password" placeholder=" " required>
                        <label for="password">Contraseña</label>
                        <span class="field-icon toggle-password" id="togglePassword">●</span>
                    </div>

                    <div class="login-options">
                        <label class="remember">
                            <input type="checkbox" id="recordarme">
                            Recordarme
                        </label>

                        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="login-btn">Entrar</button>

                    <p class="register-text">
                        ¿No tienes cuenta?
                        <a href="#" onclick="window.parent.abrirRegistro(); return false;">Regístrate</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <div id="modal-login" class="modal">
        <div class="modal-overlay"></div>

        <div class="modal-panel">
            <button id="cerrar-modal" class="modal-close" type="button">×</button>

            <span class="modal-tag" id="modal-tag">ERROR</span>
            <h2 id="modal-titulo">Error</h2>

            <p id="modal-mensaje">Mensaje aquí</p>

            <div class="modal-actions">
                <button id="cerrar-modal-secundario" class="modal-btn modal-btn-dark" type="button">
                    Cerrar
                </button>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
