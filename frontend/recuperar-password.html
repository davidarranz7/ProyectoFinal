<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="css/recuperar-password.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<main class="recovery-page">
    <section class="recovery-card">

        <div class="recovery-header">
            <h1>TiendaModa</h1>
            <p>Recuperación de contraseña</p>
        </div>

        <div class="recovery-content">
            <form id="form-recuperar-password" class="recovery-form">
                <h2>¿Olvidaste tu contraseña?</h2>

                <p class="recovery-description">
                    Introduce tu email o nombre de usuario. Si existe una cuenta asociada,
                    recibirás un correo con instrucciones para cambiar tu contraseña.
                </p>

                <div class="form-group">
                    <label for="identificador">Email o nombre de usuario</label>
                    <input type="text" id="identificador" name="identificador" required>
                </div>

                <button type="submit" id="btn-recuperar-password">
                    Enviar enlace de recuperación
                </button>

                <p id="mensaje-recuperacion" class="mensaje-recuperacion"></p>

                <a href="login.html" class="volver-login">
                    Volver al inicio
                </a>
                
                <a href="incidencias.html" target="_top" class="soporte-link">
                    ¿No tienes acceso a tu correo? Abre una incidencia
                </a>

            </form>
        </div>

    </section>
</main>

<script src="js/config.js"></script>
<script src="js/recuperar-password.js"></script>
</body>
</html>
