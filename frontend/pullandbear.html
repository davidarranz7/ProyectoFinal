<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PULL&BEAR</title>

    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/pullandbear.css">
</head>
<body>

<div id="menu-container"></div>

<main class="pull-container">
    <aside class="sidebar-filtros">

        <div class="filtro-seccion">
            <h3>Género</h3>

            <ul>
                <li>
                    <label class="filtro-item">
                        <input type="checkbox" class="filtro-check" data-tipo="genero" value="hombre">
                        <span class="filtro-label-texto">Hombre</span>
                        <span class="filtro-linea"></span>
                    </label>
                </li>

                <li>
                    <label class="filtro-item">
                        <input type="checkbox" class="filtro-check" data-tipo="genero" value="mujer">
                        <span class="filtro-label-texto">Mujer</span>
                        <span class="filtro-linea"></span>
                    </label>
                </li>
            </ul>
        </div>

        <div class="filtro-seccion">
            <h3>Categoría</h3>

            <ul id="lista-categorias-filtro">
                <li>
                    <span class="filtro-label-texto">Cargando categorías...</span>
                </li>
            </ul>
        </div>

        <div class="filtro-seccion filtro-orden">
            <h3>Ordenar</h3>

            <select id="orden-catalogo">
                <option value="recientes">Más recientes</option>
                <option value="precioAsc">Precio: menor a mayor</option>
                <option value="precioDesc">Precio: mayor a menor</option>
                <option value="nombreAsc">Nombre: A-Z</option>
                <option value="nombreDesc">Nombre: Z-A</option>
            </select>
        </div>

    </aside>

    <section class="contenido-productos">
        <header class="pull-header">
            <div class="pull-header-content">
                <span class="pull-tag">NEW SEASON</span>

                <h1>PULL&amp;BEAR</h1>

                <p id="contador-productos">NEW DROPS / 0 PRODUCTOS</p>

                <div class="pull-subtext">
                    Estilo urbano, siluetas relajadas y nuevas prendas seleccionadas para el catálogo actual.
                </div>
            </div>
        </header>

        <div class="grid-pull" id="grid-productos"></div>
    </section>
</main>

<div id="modal-login" class="modal">
    <div class="modal-overlay"></div>

    <div class="modal-panel">
        <button id="cerrar-modal" class="modal-close" type="button">×</button>

        <span class="modal-tag">ACCESO REQUERIDO</span>

        <h2>Inicia sesión para continuar</h2>

        <p id="modal-mensaje">
            Debes iniciar sesión para continuar.
        </p>

        <div class="modal-actions">
            <button id="abrir-login-modal" class="modal-btn modal-btn-dark" type="button">
                Iniciar sesión
            </button>

            <button id="cerrar-modal-secundario" class="modal-btn modal-btn-light" type="button">
                Seguir explorando
            </button>
        </div>
    </div>
</div>

<div id="toast-carrito" class="toast-carrito">Añadido al carrito</div>

<script src="js/config.js"></script>
<script src="js/menu.js"></script>
<script src="js/pullandbear.js"></script>

</body>
</html>
