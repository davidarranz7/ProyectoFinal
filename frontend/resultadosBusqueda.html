<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resultados de busqueda</title>

    <link rel="stylesheet" href="css/menu.css" />
    <link rel="stylesheet" href="css/resultadosBusqueda.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div id="menu-container"></div>

<main class="resultados-page">

    <section class="resultados-hero">
        <div class="resultados-hero-copy">
            <p class="resultados-eyebrow">Resultados</p>

            <h1>
                Resultados para
                <span id="texto-busqueda">...</span>
            </h1>

            <p class="resultados-subtitle">
                Consulta prendas y accesorios de todas las tiendas desde una sola pagina.
            </p>
        </div>

        <div class="resultados-hero-stats">
            <article class="resultados-stat-card">
                <span class="resultados-stat-label">Consulta</span>
                <strong id="resumen-busqueda">...</strong>
            </article>

            <article class="resultados-stat-card">
                <span class="resultados-stat-label">Resultados</span>
                <strong id="resumen-total-resultados">Buscando</strong>
            </article>

            <article class="resultados-stat-card resultados-stat-card-wide">
                <span class="resultados-stat-label">Filtros</span>
                <strong id="resumen-filtros-resultados">Sin filtros</strong>
            </article>
        </div>
    </section>

    <section class="resultados-panel">

        <div class="resultados-toolbar">
            <div class="resultados-toolbar-left">
                <p id="contador-resultados" class="contador-resultados">
                    Buscando productos...
                </p>

                <p id="resultados-hint" class="resultados-hint">
                    Usa los filtros si quieres ordenar mejor los resultados.
                </p>
            </div>

            <div class="resultados-toolbar-right">
                <label class="resultados-control">
                    <span>Tienda</span>
                    <select id="filtro-tienda-resultados">
                        <option value="">Todas las tiendas</option>
                        <option value="Zara">Zara</option>
                        <option value="Bershka">Bershka</option>
                        <option value="PullAndBear">Pull&amp;Bear</option>
                    </select>
                </label>

                <label class="resultados-control">
                    <span>Seccion</span>
                    <select id="filtro-seccion-resultados">
                        <option value="">Todas las secciones</option>
                        <option value="MUJER">Mujer</option>
                        <option value="HOMBRE">Hombre</option>
                        <option value="UNISEX">Unisex</option>
                    </select>
                </label>

                <label class="resultados-control">
                    <span>Orden</span>
                    <select id="orden-resultados">
                        <option value="recientes">Mas recientes</option>
                        <option value="precio-asc">Precio: menor a mayor</option>
                        <option value="precio-desc">Precio: mayor a menor</option>
                        <option value="nombre-asc">Nombre A-Z</option>
                    </select>
                </label>

                <button type="button" id="limpiar-resultados" class="resultados-reset-btn">
                    Limpiar
                </button>
            </div>
        </div>

        <div id="estado-resultados" class="estado-resultados">
            Cargando resultados...
        </div>

        <div id="grid-resultados" class="grid-resultados">
            <!-- Aqui se pintaran los productos desde resultadosBusqueda.js -->
        </div>

        <div id="sentinel-resultados" class="sentinel-resultados"></div>

    </section>

</main>

<script src="js/config.js"></script>
<script src="js/resultadosBusqueda.js"></script>
<script src="js/menu.js"></script>

</body>
</html>
