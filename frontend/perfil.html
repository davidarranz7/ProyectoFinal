<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi perfil</title>
    <link rel="stylesheet" href="css/perfil.css" />
    <link rel="stylesheet" href="css/menu.css" />
</head>
<body>
<div id="menu-container"></div>

<div class="perfil-container">
    <aside class="card perfil-lateral">
        <div class="avatar" id="avatar-inicial">D</div>
        <h2 id="perfil-nombre-lateral">Usuario</h2>
        <p>Mi cuenta personal</p>
        <button class="btn btn-principal" type="button" id="btn-cambiar-foto">Cambiar foto</button>

        <div class="mini-datos">
            <div class="mini-dato">
                <span>Correo</span>
                <span id="mini-email">usuario@email.com</span>
            </div>
            <div class="mini-dato">
                <span>Rol</span>
                <span id="mini-rol">CLIENTE</span>
            </div>
            <div class="mini-dato">
                <span>Seguridad</span>
                <span>Contraseña y acceso</span>
            </div>
        </div>
    </aside>

    <main class="contenido">
        <div id="mensaje-perfil" class="mensaje-perfil" style="display: none;"></div>

        <section class="card">
            <h1 class="titulo-seccion">Mi perfil</h1>

            <form id="formPerfil">
                <div class="form-grid">
                    <div class="campo">
                        <label for="nombre">Nombre de usuario</label>
                        <input type="text" id="nombre" value="" />
                    </div>

                    <div class="campo">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" value="" />
                    </div>

                    <div class="campo campo-completo">
                        <label for="rol">Rol</label>
                        <input type="text" id="rol" value="" readonly />
                    </div>
                </div>

                <div class="acciones">
                    <button class="btn btn-principal" type="submit">Guardar cambios</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2 class="titulo-seccion">Cambiar contraseña</h2>

            <form id="formPassword">
                <div class="form-grid">
                    <div class="campo campo-completo">
                        <label for="passwordActual">Contraseña actual</label>
                        <input type="password" id="passwordActual" />
                    </div>

                    <div class="campo">
                        <label for="passwordNueva">Nueva contraseña</label>
                        <input type="password" id="passwordNueva" />
                    </div>

                    <div class="campo">
                        <label for="confirmarPassword">Confirmar nueva contraseña</label>
                        <input type="password" id="confirmarPassword" />
                    </div>
                </div>

                <div class="acciones">
                    <button class="btn btn-principal" type="submit">Actualizar contraseña</button>
                </div>
            </form>
        </section>

        <section class="card">
            <div class="tarjetas-header">
                <h2 class="titulo-seccion titulo-sin-margen">Métodos de pago</h2>
                <button class="btn btn-principal btn-auto" id="btn-anadir-tarjeta" type="button">
                    + Añadir tarjeta
                </button>
            </div>

            <div class="tarjetas" id="contenedor-tarjetas">
                <!-- JS pinta aquí las tarjetas -->
            </div>
        </section>
    </main>
</div>

<!-- MODAL AÑADIR TARJETA -->
<div id="modal-tarjeta" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:99999; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#fff; width:100%; max-width:520px; border-radius:18px; padding:24px; box-shadow:0 20px 45px rgba(0,0,0,0.18); position:relative;">
        <button id="cerrar-modal-tarjeta" type="button" style="position:absolute; top:12px; right:14px; border:none; background:transparent; font-size:24px; cursor:pointer;">×</button>

        <h2 style="margin-bottom:18px;">Añadir tarjeta</h2>

        <form id="formTarjeta">
            <div style="display:grid; gap:14px;">
                <div>
                    <label for="titularTarjeta" style="display:block; margin-bottom:6px;">Titular</label>
                    <input type="text" id="titularTarjeta" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:10px;" />
                </div>

                <div>
                    <label for="numeroTarjeta" style="display:block; margin-bottom:6px;">Número de tarjeta</label>
                    <input type="text" id="numeroTarjeta" placeholder="1234123412341234" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:10px;" />
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
                    <div>
                        <label for="fechaExpiracionTarjeta" style="display:block; margin-bottom:6px;">Fecha expiración</label>
                        <input type="text" id="fechaExpiracionTarjeta" placeholder="MM/AA" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:10px;" />
                    </div>

                    <div>
                        <label for="tipoTarjeta" style="display:block; margin-bottom:6px;">Tipo</label>
                        <select id="tipoTarjeta" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:10px;">
                            <option value="">Selecciona tipo</option>
                            <option value="VISA">Visa</option>
                            <option value="MASTERCARD">Mastercard</option>
                        </select>
                    </div>
                </div>
            </div>

            <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:22px;">
                <button id="cancelar-modal-tarjeta" type="button" style="padding:12px 16px; border:none; border-radius:10px; background:#eee; cursor:pointer;">
                    Cancelar
                </button>
                <button type="submit" style="padding:12px 16px; border:none; border-radius:10px; background:#111; color:#fff; cursor:pointer;">
                    Guardar tarjeta
                </button>
            </div>
        </form>
    </div>
</div>

<script src="js/perfil.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
