<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi perfil</title>
    <link rel="stylesheet" href="css/perfil.css" />
    <link rel="stylesheet" href="css/menu.css" />
</head>
<body>
<div id="menu-container"></div>

<div class="perfil-container">
    <aside class="card perfil-lateral">
        <div class="avatar" id="avatar-inicial">D</div>
        <h2 id="perfil-nombre-lateral">Usuario</h2>
        <p>Mi cuenta personal</p>
        <button class="btn btn-principal" type="button" id="btn-cambiar-foto">Cambiar foto</button>

        <div class="mini-datos">
            <div class="mini-dato">
                <span>Correo</span>
                <span id="mini-email">usuario@email.com</span>
            </div>
            <div class="mini-dato">
                <span>Rol</span>
                <span id="mini-rol">CLIENTE</span>
            </div>
            <div class="mini-dato">
                <span>Seguridad</span>
                <span>Contraseña y acceso</span>
            </div>
        </div>
    </aside>

    <main class="contenido">
        <div id="mensaje-perfil" class="mensaje-perfil" style="display: none;"></div>

        <section class="card">
            <h1 class="titulo-seccion">Mi perfil</h1>

            <form id="formPerfil">
                <div class="form-grid">
                    <div class="campo">
                        <label for="nombre">Nombre de usuario</label>
                        <input type="text" id="nombre" value="" />
                    </div>

                    <div class="campo">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" value="" />
                    </div>

                    <div class="campo campo-completo">
                        <label for="rol">Rol</label>
                        <input type="text" id="rol" value="" readonly />
                    </div>
                </div>

                <div class="acciones">
                    <button class="btn btn-principal" type="submit" id="btn-guardar-perfil">Guardar cambios</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2 class="titulo-seccion">Cambiar contraseña</h2>

            <form id="formPassword">
                <div class="form-grid">
                    <div class="campo campo-completo">
                        <label for="passwordActual">Contraseña actual</label>
                        <input type="password" id="passwordActual" />
                    </div>

                    <div class="campo">
                        <label for="passwordNueva">Nueva contraseña</label>
                        <input type="password" id="passwordNueva" />
                    </div>

                    <div class="campo">
                        <label for="confirmarPassword">Confirmar nueva contraseña</label>
                        <input type="password" id="confirmarPassword" />
                    </div>
                </div>

                <div class="acciones">
                    <button class="btn btn-principal" type="submit">Actualizar contraseña</button>
                </div>
            </form>
        </section>

        <section class="card">
            <div class="tarjetas-header">
                <h2 class="titulo-seccion titulo-sin-margen">Métodos de pago</h2>
                <button class="btn btn-principal btn-auto" id="btn-anadir-tarjeta" type="button">
                    + Añadir tarjeta
                </button>
            </div>

            <div class="tarjetas" id="contenedor-tarjetas">
                <!-- JS pinta aquí las tarjetas -->
            </div>
        </section>
    </main>
</div>

<div id="modal-tarjeta" class="modal-overlay" style="display:none;">
    <div class="modal-contenido modal-mediano">
        <button id="cerrar-modal-tarjeta" type="button" class="modal-cerrar">×</button>

        <h2 class="modal-titulo">Añadir tarjeta</h2>

        <form id="formTarjeta">
            <div class="modal-grid">
                <div>
                    <label for="titularTarjeta" class="modal-label">Titular</label>
                    <input type="text" id="titularTarjeta" class="modal-input" />
                </div>

                <div>
                    <label for="numeroTarjeta" class="modal-label">Número de tarjeta</label>
                    <input type="text" id="numeroTarjeta" class="modal-input" placeholder="1234123412341234" />
                </div>

                <div class="modal-doble">
                    <div>
                        <label for="fechaExpiracionTarjeta" class="modal-label">Fecha expiración</label>
                        <input type="text" id="fechaExpiracionTarjeta" class="modal-input" placeholder="MM/AA" />
                    </div>

                    <div>
                        <label for="tipoTarjeta" class="modal-label">Tipo</label>
                        <select id="tipoTarjeta" class="modal-input">
                            <option value="">Selecciona tipo</option>
                            <option value="VISA">Visa</option>
                            <option value="MASTERCARD">Mastercard</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="modal-acciones">
                <button id="cancelar-modal-tarjeta" type="button" class="btn btn-secundario">
                    Cancelar
                </button>
                <button type="submit" class="btn btn-principal">
                    Guardar tarjeta
                </button>
            </div>
        </form>
    </div>
</div>

<div id="modal-confirmar-eliminar" class="modal-overlay" style="display:none;">
    <div class="modal-contenido modal-pequeno">
        <button id="cerrar-modal-eliminar" type="button" class="modal-cerrar">×</button>

        <h2 class="modal-titulo">Eliminar tarjeta</h2>
        <p class="modal-texto">¿Seguro que quieres eliminar esta tarjeta?</p>

        <div class="modal-acciones">
            <button id="cancelar-eliminar-tarjeta" type="button" class="btn btn-secundario">
                Cancelar
            </button>
            <button id="confirmar-eliminar-tarjeta" type="button" class="btn btn-peligro">
                Eliminar
            </button>
        </div>
    </div>
</div>

<script src="js/perfil.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
