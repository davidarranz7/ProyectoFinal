<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZARA</title>

    <link rel="stylesheet" href="../estilos/menu.css">
    <link rel="stylesheet" href="../estilos/zara.css">
</head>
<body>

    <div id="menu-container"></div>

    <main class="zara-container">
<aside class="sidebar-filtros">

    <div class="filtro-seccion">
        <h3>Género</h3>
        <ul>
            <li>
                <label class="filtro-item">
                    <input type="checkbox" class="filtro-check" data-tipo="genero" value="hombre">
                    <span class="filtro-label-texto">Hombre</span>
                    <span class="filtro-linea"></span>
                </label>
            </li>
            <li>
                <label class="filtro-item">
                    <input type="checkbox" class="filtro-check" data-tipo="genero" value="mujer">
                    <span class="filtro-label-texto">Mujer</span>
                    <span class="filtro-linea"></span>
                </label>
            </li>
        </ul>
    </div>

    <div class="filtro-seccion">
        <h3>Categoría</h3>
        <ul>
            <li>
                <label class="filtro-item">
                    <input type="checkbox" class="filtro-check" data-tipo="categoria" value="camiseta">
                    <span class="filtro-label-texto">Camisetas</span>
                    <span class="filtro-linea"></span>
                </label>
            </li>
            <li>
                <label class="filtro-item">
                    <input type="checkbox" class="filtro-check" data-tipo="categoria" value="pantalon">
                    <span class="filtro-label-texto">Pantalones</span>
                    <span class="filtro-linea"></span>
                </label>
            </li>
            <li>
                <label class="filtro-item">
                    <input type="checkbox" class="filtro-check" data-tipo="categoria" value="sudadera">
                    <span class="filtro-label-texto">Sudaderas</span>
                    <span class="filtro-linea"></span>
                </label>
            </li>
            <li>
                <label class="filtro-item">
                    <input type="checkbox" class="filtro-check" data-tipo="categoria" value="abrigo">
                    <span class="filtro-label-texto">Abrigos</span>
                    <span class="filtro-linea"></span>
                </label>
            </li>
        </ul>
    </div>

</aside>
        <section class="contenido-productos">
        <header class="zara-header">
            <div class="zara-header-content">
                <h1>ZARA</h1>
                <p id="contador-productos">NEW COLLECTION / 0 PRODUCTOS</p>
                <div class="zara-subtext">
                    Siluetas limpias, tonos neutros y una estética editorial inspirada en campañas de moda contemporánea.
                </div>
            </div>
        </header>

            <div class="grid-zara" id="grid-productos"></div>
        </section>
    </main>

        <div id="modal-login" class="modal">
            <div class="modal-overlay"></div>

            <div class="modal-panel">
                <button id="cerrar-modal" class="modal-close" type="button">×</button>

                <span class="modal-tag">ACCESO REQUERIDO</span>
                <h2>Inicia sesión para continuar</h2>
                    <p id="modal-mensaje">
                        Debes iniciar sesión para continuar.
                    </p>

                <div class="modal-actions">
                    <a href="login.html" class="modal-btn modal-btn-dark">Iniciar sesión</a>
                    <button id="cerrar-modal-secundario" class="modal-btn modal-btn-light" type="button">
                        Seguir explorando
                    </button>
                </div>
            </div>
        </div>

    <script src="../script/menu.js"></script>
    <script src="../script/zara.js"></script>
    
</body>
</html>
