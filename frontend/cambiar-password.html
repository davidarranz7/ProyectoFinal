<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contrasena</title>
    <link rel="stylesheet" href="css/cambiar-password.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<main class="reset-page">
    <section class="reset-card">

        <div class="reset-header">
            <h1>MODA</h1>
            <p>Recuperar acceso</p>
        </div>

        <div class="reset-content">

            <div id="token-error" class="token-error hidden">
                <h2>Enlace no valido</h2>
                <p>El enlace de recuperacion no es valido o ya no esta disponible.</p>
            </div>

            <form id="form-cambiar-password" class="reset-form">
                <h2>Crea una nueva contrasena</h2>

                <p class="reset-description">
                    Elige una contrasena nueva para volver a entrar en tu cuenta.
                </p>

                <div class="form-group">
                    <label for="nuevaPassword">Nueva contrasena</label>
                    <input type="password" id="nuevaPassword" name="nuevaPassword" required>
                </div>

                <div class="form-group">
                    <label for="repetirPassword">Repetir contrasena</label>
                    <input type="password" id="repetirPassword" name="repetirPassword" required>
                </div>

                <button type="submit" id="btn-cambiar-password">
                    Guardar contrasena
                </button>

                <p id="mensaje-password" class="mensaje-password"></p>
            </form>

        </div>

    </section>
</main>

<script src="js/config.js"></script>
<script src="js/cambiar-password.js"></script>
</body>
</html>
