<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperacion de usuario</title>
</head>
<body style="margin:0; padding:0; background-color:#f6efe8; font-family:Arial, Helvetica, sans-serif; color:#2a211c;">

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f6efe8; margin:0; padding:32px 0;">
    <tr>
        <td align="center" style="padding:0 16px;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px; background-color:#fffaf5; border:1px solid #eadfce; border-radius:22px; overflow:hidden;">

                <tr>
                    <td style="padding:28px 32px; background-color:#2a211c; color:#ffffff;">
                        <p style="margin:0 0 8px 0; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#dbc7b0;">MODA</p>
                        <h1 style="margin:0; font-size:30px; line-height:1.2; font-weight:700;">Tu usuario</h1>
                        <p style="margin:10px 0 0 0; font-size:14px; line-height:1.6; color:#efe3d5;">
                            Te dejamos aqui el nombre de usuario asociado a tu cuenta.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td style="padding:32px;">
                        <p style="margin:0 0 18px 0; font-size:15px; line-height:1.7;">
                            Hola <strong>{{NOMBRE_USUARIO}}</strong>,
                        </p>

                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:separate; background-color:#fcf8f3; border:1px solid #eadfce; border-radius:18px; margin-bottom:22px;">
                            <tr>
                                <td style="padding:22px; text-align:center;">
                                    <p style="margin:0 0 10px 0; font-size:14px; color:#7a6755;">Tu usuario es</p>
                                    <p style="margin:0; font-size:28px; font-weight:700; color:#2a211c;">{{NOMBRE_USUARIO}}</p>
                                </td>
                            </tr>
                        </table>

                        <p style="margin:0; font-size:14px; line-height:1.7; color:#5f5144;">
                            Ya puedes volver a iniciar sesion con ese usuario y tu contrasena habitual.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td style="padding:18px 32px; border-top:1px solid #eadfce; background-color:#f9f3ec;">
                        <p style="margin:0; font-size:12px; line-height:1.6; color:#7a6755;">
                            Equipo MODA
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>

</body>
</html>
